<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>

        <h1>Minha Lista de Tarefas</h1>

        <!--Cadastro de tarefa -->
        <section>
            <h2>Nova Tarefa</h2>
            <form id="form-tarefa">
                <div>
                    <label for="nome">Nome da Tarefa</label>
                    <input type="text" id="nome" placeholder="Ex: Estudar JavaScript" required>
                </div>

                <div>
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" placeholder="Descreva sua tarefa" required></textarea>
                </div>

                <div>
                    <button type="submit" id="botao-submit">Adicionar tarefa</button>
                </div>
            </form>
            <!-- área das mensagens da app-->
            <div id="mensagem" role="status" aria-live="polite"></div>
        </section>

        <!--Listagem de Tarefas -->

        <section>
            <h2>Tarefas</h2>
            <div id="lista-tarefas"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
